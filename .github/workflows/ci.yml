name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SCHEDULER_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://example.neonauth.neon.tech/ci/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-at-least-32-characters
          CRON_SECRET: ci-only-cron-secret-at-least-32-characters
          PRIVACY_CONTROLLER_NAME: CI Controller
          PRIVACY_CONTROLLER_ADDRESS: CI Address
          PRIVACY_CONTACT_EMAIL: privacy@example.com
          SECURITY_CONTACT_EMAIL: security@example.com
          NEXT_PUBLIC_ENABLE_ANALYTICS: "false"

      - name: Audit production dependencies
        run: bun audit --audit-level=high
